name: daily-papers

on:
  schedule:
    # 北京时间每天 09:00
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python check_config.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_IDS: ${{ secrets.FEISHU_OPEN_IDS }}
          FEISHU_WEBHOOKS: ${{ secrets.FEISHU_WEBHOOKS }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python main.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_IDS: ${{ secrets.FEISHU_OPEN_IDS }}
          FEISHU_WEBHOOKS: ${{ secrets.FEISHU_WEBHOOKS }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          OPENAI_REASONING_EFFORT: low
          ARXIV_CATEGORIES: "cs.HC,cs.AI,cs.LG,stat.ML,cs.CL,cs.CV,cs.GR,cs.RO"
          MAX_RESULTS_PER_CATEGORY: "50"
          MIN_RELEVANCE_SCORE: "4"
          KEYWORDS: "artificial intelligence,AI,machine learning,ML,deep learning,neural network,foundation model,large language model,LLM,generative AI,multimodal,vision-language,AI agent,autonomous agent,human-AI interaction,human-centered AI,explainable AI,XAI,AI-assisted,AI-mediated,extended reality,XR,virtual reality,VR,augmented reality,AR,mixed reality,MR,spatial computing,immersive,embodied interaction,head-mounted display,HMD,hand tracking,human-computer interaction,HCI,user study,interaction design,user experience,UX,usability,mixed-initiative,creativity support,design tool,benchmark,dataset,evaluation"
          TOP_N: "5"
