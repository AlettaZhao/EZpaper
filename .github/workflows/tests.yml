name: tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile core modules
        run: python -m py_compile main.py feishu.py check_config.py
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v
